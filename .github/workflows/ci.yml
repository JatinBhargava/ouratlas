name: CI

# Every push and PR is checked. Only master publishes images.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Create a git tag for the versions in versions.json (master only)"
        type: boolean
        default: false

env:
  # GHCR requires a lowercase path, which is not always what the owner is called.
  IMAGE_PREFIX: ghcr.io/jatinbhargava/ouratlas

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # --frozen-lockfile so CI fails on a lockfile that was never committed,
      # rather than quietly resolving something different from local.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Catches anything that type-checks but cannot be bundled — a bad asset
      # import, a Tailwind class that breaks the build.
      - name: Build frontend
        run: bun run build
        env:
          # Placeholders. The real values are baked into the published image,
          # not here; this step only proves the build works.
          BUN_PUBLIC_SUPABASE_URL: https://example.supabase.co
          BUN_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      # Boots the API exactly as the container does and waits for /api/health.
      # Every integration is unconfigured here, which is the point: the server
      # must start and answer with no keys at all.
      - name: Smoke-test the API
        run: |
          SERVE_STATIC=false PORT=3000 bun api/index.ts &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "API answered health check"
              curl -s http://127.0.0.1:3000/api/nope | grep -q "No such endpoint" \
                && echo "API 404s correctly"
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy"
          exit 1

  publish:
    name: Build and push images
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # versions.json is the only place a version number is written. Reading it
      # here means the image tags cannot drift from what the code reports at
      # runtime, because both come from this file.
      - name: Read versions
        id: versions
        run: |
          api=$(bun scripts/versions.ts api)
          ui=$(bun scripts/versions.ts ui)
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "ui=$ui"   >> "$GITHUB_OUTPUT"
          echo "Publishing api v$api and web v$ui"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both values are read from Variables *or* Secrets, because which tab
      # they were typed into is not something the build should care about.
      # Checking here means a missing one fails in seconds with a message that
      # says where to put it, rather than deep inside the web image build.
      - name: Check the frontend build args are present
        env:
          URL: ${{ vars.BUN_PUBLIC_SUPABASE_URL || secrets.BUN_PUBLIC_SUPABASE_URL }}
          ANON: ${{ secrets.BUN_PUBLIC_SUPABASE_ANON_KEY || vars.BUN_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$URL" ]  || missing="$missing BUN_PUBLIC_SUPABASE_URL"
          [ -n "$ANON" ] || missing="$missing BUN_PUBLIC_SUPABASE_ANON_KEY"

          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            echo "Either tab works. Repository level, not Environment level —"
            echo "an Environment-scoped value needs an 'environment:' key on the job."
            exit 1
          fi

          # Never print the values; confirm only that they arrived.
          echo "Both build args present (URL is ${#URL} chars, anon key ${#ANON} chars)."

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:v${{ steps.versions.outputs.api }}
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.api }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # The frontend's Supabase settings are compiled into the bundle, so they
      # are build arguments here rather than runtime environment. They are
      # public values — the anon key is served to every visitor — but they live
      # in repository settings so they are not committed.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:v${{ steps.versions.outputs.ui }}
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.versions.outputs.ui }}
            BUN_PUBLIC_SUPABASE_URL=${{ vars.BUN_PUBLIC_SUPABASE_URL || secrets.BUN_PUBLIC_SUPABASE_URL }}
            BUN_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.BUN_PUBLIC_SUPABASE_ANON_KEY || vars.BUN_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ""
            echo '```'
            echo "${{ env.IMAGE_PREFIX }}-api:v${{ steps.versions.outputs.api }}"
            echo "${{ env.IMAGE_PREFIX }}-web:v${{ steps.versions.outputs.ui }}"
            echo ""
            echo "also tagged :latest and :${{ github.sha }}"
            echo '```'
            echo ""
            echo "Deploy with \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Marks the commit a version was built from, so a release can be found and
  # checked out again later. Off unless asked for, because every push to master
  # would otherwise try to tag the same version again until versions.json moves.
  #
  # Two switches, either one enough:
  #   - the "Create a git tag" box when running this workflow by hand
  #     (Actions -> CI -> Run workflow), for a one-off release;
  #   - the repository variable TAG_ON_BUILD=true (Settings -> Secrets and
  #     variables -> Actions -> Variables), to tag every master build.
  #
  # Master only: a tag names a release, and releases come from master.
  tag:
    name: Tag the release
    needs: [check, publish]
    # always() so a skipped publish (a manual run publishes nothing) does not
    # skip this too; a failed one still stops it, since images and tag must agree.
    if: >-
      always()
      && needs.check.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
      && github.ref == 'refs/heads/master'
      && ((github.event_name == 'workflow_dispatch' && inputs.tag)
          || (github.event_name == 'push' && vars.TAG_ON_BUILD == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # One tag while the API and the frontend share a version, which is the
      # usual case; one per part, named like the images, once they differ, so a
      # tag never claims a version one of them is not at.
      #
      # A tag that already exists is left where it is. It usually means this
      # version was tagged by an earlier build and versions.json has not moved
      # since; moving a published tag would rewrite what a release points to.
      - name: Create tags
        run: |
          api=$(bun scripts/versions.ts api)
          ui=$(bun scripts/versions.ts ui)

          if [ "$api" = "$ui" ]; then
            tags="v$api"
          else
            tags="api-v$api web-v$ui"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The tag's message is that version's CHANGELOG.md entry, so
          # `git show <tag>` says what the release holds. A version with no
          # entry still gets tagged, with a one-line message and a warning.
          notes() {
            awk -v head="## [$1]" '
              index($0, head) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md
          }

          created=""
          for tag in $tags; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::notice::$tag already exists; left as it is. Bump versions.json to tag a new release."
              continue
            fi

            version="${tag##*v}"
            {
              echo "Atlas $tag (api v$api, web v$ui)"
              echo ""
              notes "$version"
            } > tag-message.txt
            if [ -z "$(notes "$version")" ]; then
              echo "::warning::CHANGELOG.md has no entry for $version; tagging with a one-line message."
            fi

            git tag -a "$tag" -F tag-message.txt "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
            created="$created $tag"
          done

          {
            echo "### Tags"
            echo ""
            if [ -n "$created" ]; then
              echo "Created:$created at \`${GITHUB_SHA::7}\`"
            else
              echo "Nothing new: every tag for these versions already exists."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
