name: CI

# Every push and PR is checked. Only master publishes images.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # GHCR requires a lowercase path, which is not always what the owner is called.
  IMAGE_PREFIX: ghcr.io/jatinbhargava/ouratlas

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # --frozen-lockfile so CI fails on a lockfile that was never committed,
      # rather than quietly resolving something different from local.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Catches anything that type-checks but cannot be bundled — a bad asset
      # import, a Tailwind class that breaks the build.
      - name: Build frontend
        run: bun run build
        env:
          # Placeholders. The real values are baked into the published image,
          # not here; this step only proves the build works.
          BUN_PUBLIC_SUPABASE_URL: https://example.supabase.co
          BUN_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      # Boots the API exactly as the container does and waits for /api/health.
      # Every integration is unconfigured here, which is the point: the server
      # must start and answer with no keys at all.
      - name: Smoke-test the API
        run: |
          SERVE_STATIC=false PORT=3000 bun api/index.ts &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "API answered health check"
              curl -s http://127.0.0.1:3000/api/nope | grep -q "No such endpoint" \
                && echo "API 404s correctly"
              exit 0
            fi
            sleep 1
          done
          echo "API never became healthy"
          exit 1

  publish:
    name: Build and push images
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # The frontend's Supabase settings are compiled into the bundle, so they
      # are build arguments here rather than runtime environment. They are
      # public values — the anon key is served to every visitor — but they live
      # in repository settings so they are not committed.
      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:latest
            ${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}
          build-args: |
            BUN_PUBLIC_SUPABASE_URL=${{ vars.BUN_PUBLIC_SUPABASE_URL }}
            BUN_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.BUN_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ""
            echo '```'
            echo "${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}"
            echo "${{ env.IMAGE_PREFIX }}-web:${{ github.sha }}"
            echo '```'
            echo ""
            echo "Deploy with \`docker compose pull && docker compose up -d\`."
          } >> "$GITHUB_STEP_SUMMARY"
