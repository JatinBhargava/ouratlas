# nginx serves the built frontend and forwards /api to the API container.
#
# Both containers therefore share one origin. That is the point of putting a
# proxy here rather than exposing two ports: no CORS, no second base URL in the
# client, and Stripe's webhook path plus Supabase's redirect URLs all live on
# the same domain in production as in development.

server {
    listen       80;
    # Some hosts route container traffic over IPv6, and a v4-only socket
    # silently refuses it. Cheap to accept both.
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Bun's build inlines nothing above a few hundred KB, but the JS bundle is
    # large enough that compression is worth more than the CPU it costs.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm;

    # A story on its way to the copy desk can approach the 1 MB the API allows.
    client_max_body_size 2m;

    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The copy desk streams its answer a piece at a time. Buffering here
        # would hold the whole edit back and deliver it in one lump at the end,
        # which is exactly what the streaming was written to avoid. The route
        # also sends X-Accel-Buffering: no, but say it here too so the
        # behaviour does not depend on a header.
        proxy_buffering    off;
        proxy_cache        off;

        # That same stream makes several sequential model passes over a long
        # story, so the default 60s read timeout would cut someone's trip in
        # half mid-sentence.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Filenames from Bun's build are content-hashed, so a changed file is a
    # changed name and these can be cached indefinitely.
    location ~* \.(js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico|map)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html is the one file whose name never changes, so it must never be
    # cached — otherwise a deploy ships new hashed assets that nobody fetches.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: /account and /create are React Router's, not files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
