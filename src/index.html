<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Trip photos and your own words, set as a magazine you can keep. Ten photographs and up to ten thousand words in; a paginated issue out, ready to export."
    />
    <meta name="theme-color" content="#0c0a09" />

    <!--
      The share card.

      Absolute URLs throughout: a crawler resolves these against nothing, so a
      relative path is simply dropped and the link unfurls bare. The image is
      copied to /og.jpg verbatim by build.ts rather than bundled, because this
      address is pasted into other people's caches and must not move when the
      file changes.

      A JPEG rather than a PNG: the same card as a PNG is near a megabyte, and
      WhatsApp declines to show a thumbnail much over 300 KB. Run
      `bun scripts/og-image.ts scripts/og/hero.png` to rebuild it.
    -->
    <link rel="canonical" href="https://ouratlas.co.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atlas" />
    <meta property="og:url" content="https://ouratlas.co.in/" />
    <meta property="og:title" content="Atlas — your trip, set as a magazine" />
    <meta
      property="og:description"
      content="Ten photographs and up to ten thousand words in; a paginated issue out, ready to export. The photographs never leave your browser."
    />
    <meta property="og:image" content="https://ouratlas.co.in/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Atlas home page: the headline 'The trip is over. The story isn't.' over an illustrated sky, with a magazine spread beginning below it."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atlas — your trip, set as a magazine" />
    <meta
      name="twitter:description"
      content="Ten photographs and up to ten thousand words in; a paginated issue out, ready to export. The photographs never leave your browser."
    />
    <meta name="twitter:image" content="https://ouratlas.co.in/og.jpg" />
    <!--
      The headline face, served from this deployment rather than from Google.

      It used to arrive via a stylesheet <link> to fonts.googleapis.com: a
      render-blocking request to a third party before anything can be painted —
      DNS, TLS and a round trip for the CSS, then a second journey to
      fonts.gstatic.com for the file. Declared here instead, the browser starts
      fetching the font while the real stylesheet is still in flight, from an
      origin it is already talking to.

      Inline rather than in globals.css because the CSS bundler will not leave
      the URL alone: given a relative path it inlines the whole 62 KB face as
      base64 into the render-blocking stylesheet, and given an absolute one it
      fails to resolve it. Neither is what a font wants.

      `swap` so the words are readable in the fallback while the file arrives.
      Instrument Serif is published by Rosetta under the SIL Open Font
      License 1.1.
    -->
    <style>
      @font-face {
        font-family: "Instrument Serif";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/instrument-serif.ttf") format("truetype");
      }
    </style>

    <!--
      No <link> for favicon.ico on purpose: it is served from the root, which
      is where every browser and crawler looks for it without being told. The
      SVG below is the one that needs announcing, being the better icon where
      it is understood.
    -->
    <link rel="icon" type="image/svg+xml" href="./assets/atlas-mark.svg" />
    <link rel="apple-touch-icon" href="./assets/atlas-mark.svg" />
    <title>Atlas — your trip, set as a magazine</title>

    <!--
      Structured data. Deliberately modest: what the thing is, who publishes it
      and what it costs to start. No ratings, no review counts and no prices for
      the paid plans — those would be claims, and an invented one is worse than
      an absent one.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://ouratlas.co.in/#website",
            "url": "https://ouratlas.co.in/",
            "name": "Atlas",
            "description": "Trip photos and your own words, set as a magazine you can keep.",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://ouratlas.co.in/#app",
            "name": "Atlas",
            "url": "https://ouratlas.co.in/",
            "applicationCategory": "DesignApplication",
            "operatingSystem": "Any modern web browser",
            "browserRequirements": "Requires JavaScript",
            "isPartOf": { "@id": "https://ouratlas.co.in/#website" },
            "description": "Ten photographs and up to ten thousand words in; a paginated magazine issue out, ready to export as a PDF. The photographs and the writing are laid out in the browser and are never uploaded.",
            "featureList": [
              "Automatic magazine layout with cover, contents, spreads and folios",
              "Export to PDF at print size",
              "Photographs never leave the browser"
            ],
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "INR",
              "description": "Free to compose and export."
            }
          }
        ]
      }
    </script>

    <!--
      Umami: page views and referrers, nothing else. Cookieless and with no
      fingerprinting, which is what lets the privacy policy keep saying we set
      no tracking cookies. `defer` so it never blocks the first paint.
    -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="c509399f-ae61-4c4c-9139-273077b4627b"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
